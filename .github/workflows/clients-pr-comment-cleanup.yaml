name: Clients PR Comment Cleanup

on:
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - 'clients/**'

jobs:
  remove-clients-reminder:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Remove clients reminder comment if present
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            
            // Unique identifier for our bot comment
            const COMMENT_IDENTIFIER = '<!-- CLIENTS_RELEASE_NOTES_BOT_COMMENT -->';

            try {
              // Get all comments on the PR
              const { data: comments } = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: prNumber,
              });

              // Find existing bot comment
              const existingComment = comments.find(comment => 
                comment.body.includes(COMMENT_IDENTIFIER)
              );

              if (existingComment) {
                // Delete the comment
                console.log(`Deleting existing comment ${existingComment.id}`);
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: existingComment.id,
                });
                console.log('Reminder comment deleted successfully');
              } else {
                console.log('No existing reminder comment found - no action needed');
              }

            } catch (error) {
              console.error('Error removing comment:', error);
              // Don't fail the workflow for comment cleanup errors
              console.log('Comment cleanup failed, but continuing...');
            } 