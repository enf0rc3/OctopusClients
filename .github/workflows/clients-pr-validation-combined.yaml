name: Octopus Clients PR Validation

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  # Check for client changes - this runs for all PRs
  check-client-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      has-client-changes: ${{ steps.check-changes.outputs.has-client-changes }}
    steps:
      - name: Check for client changes
        id: check-changes
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            
            // Get list of changed files in the PR
            const { data: files } = await github.rest.pulls.listFiles({
              owner,
              repo,
              pull_number: prNumber,
            });
            
            // Check if any files are in the clients/ directory
            const hasClientChanges = files.some(file => file.filename.startsWith('clients/'));
            
            console.log(`Has client changes: ${hasClientChanges}`);
            console.log(`Changed files: ${files.map(f => f.filename).join(', ')}`);
            
            core.setOutput('has-client-changes', hasClientChanges);
            return hasClientChanges;

  # ==========================================
  # JOBS FOR PRs WITH CLIENT CHANGES
  # ==========================================

  # Run client validation logic when there ARE client changes
  has_client_changes_validate_pr:
    needs: check-client-changes
    if: needs.check-client-changes.outputs.has-client-changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Verify 'release notes:' and 'semver:' commands have been added to the PR Description and are valid.
        id: get_and_validate_pr_description
        uses: actions/github-script@v7
        with:
          script: |
            const prDescription = context.payload.pull_request.body || '';
            console.debug('--- PR Description start ---');
            console.debug(prDescription);
            console.debug('--- PR Description end ---');

            // returns the value of a given 'command' (text following the commands ':')
            function extractCommand(inputString, command) {
              // regex to match a single line with a 'command' such as "release notes:" or "semver:"
              const regex = new RegExp(`${command}:\\s*(.*)`);

              // Split the input string into lines (semver and release notes only support single command and single line for simplicity)
              // If you need multi line release notes, please manually go add them to the github release once it is created on the clients repo.
              
              // Find the first line that matches the regex
              const matchingLine = inputString.split('\n').find(line => regex.test(line));
              if (matchingLine) {
                  const match = matchingLine.match(regex);
                  return {
                      found: true,
                      value: match[1].trim() // Trim to remove unnecessary spaces
                  };
              }

              // Return an object indicating that it was not found
              return {
                  found: false,
                  value: null
              };
            }
              
            // ----------------------------
            // Get & Validate "release notes:"
            // ----------------------------
            const releaseNotes = extractCommand(prDescription, 'release notes');
            console.debug("Extracted release notes content:", releaseNotes);

            // Validate and return error if incorrect.
            if (!releaseNotes.found) {
              core.setFailed('"release notes:" section is missing from PR description');
              core.setOutput('release_notes_error', '"release notes:" section is missing from PR description');
            } else {
              // Validate the content of the release notes
              if (!releaseNotes.value) {
                core.setFailed('"release notes:" section found but no content');
                core.setOutput('release_notes_error', '"release notes:" section found but no content');
              }
            }

            // ----------------------------
            // Get & Validate "semver:"
            // ----------------------------

            const semver = extractCommand(prDescription, 'semver');
            console.debug("Extracted semver content:", semver);

            const allowedSemverValues = ["breaking", "feature", "no breaking changes", "major", "minor", "patch"];

            // Validate and return error if incorrect.
            if (!semver.found) {
              core.setOutput('semver_error', '"semver:" section is missing from PR description');
              core.setFailed('"semver:" section is missing from PR description');
            } else {  
              // Validate the content of the semver
              if (!semver.value || !allowedSemverValues.includes(semver.value)) {
                core.setOutput('semver_error', `"semver:" section found but invalid value: "${semver.value}". Allowed: ${allowedSemverValues.join(', ')}`);
                core.setFailed(`"semver:" section found but invalid value: "${semver.value}". Allowed: ${allowedSemverValues.join(', ')}`);
              }
            }

      - name: Set status check based on validation results
        id: set-clients-pull-request-status-check
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            // using the potential `core.setFailed` of the previous steps update the create commit status to reflect success or failure from previous steps. combining the failed failures
            const validateDescriptionFailed = '${{ steps.get_and_validate_pr_description.outcome }}' === 'failure';

            var state = '';
            var description = '';
            // Note this must match the status_check_name in the bypass job below
            var status_check_name = "Pull Request: Octopus Clients changes have required sections";

            if (validateDescriptionFailed) {
              state = 'failure';

              var errors = [];

              const releaseNotesFailedMessage = '${{ steps.get_and_validate_pr_description.outputs.release_notes_error }}';
              if (releaseNotesFailedMessage) {
                errors.push(releaseNotesFailedMessage);
              }
              const semverFailedMessage = '${{ steps.get_and_validate_pr_description.outputs.semver_error }}';
              if (semverFailedMessage) {
                errors.push(semverFailedMessage);
              }
              description = errors.join(', ');

            } else {
              state = 'success';
              description = 'All clients pull request requirements have been met';
            }

            console.debug("setting status check for:", status_check_name);
            console.debug("state:", state);
            console.debug("description:", description);

            // Set the commit status to reflect the success or failure of the previous steps.
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: state,
              context: status_check_name,
              description: description,
            });

  # Create or update clients reminder comment when there ARE client changes
  has_client_changes_upsert_comment:
    needs: [check-client-changes, has_client_changes_validate_pr]
    if: needs.check-client-changes.outputs.has-client-changes == 'true' && always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Create or update clients reminder comment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            
            // Get validation result
            const validationResult = '${{ needs.has_client_changes_validate_pr.result }}';
            console.log(`Validation result: ${validationResult}`);
            
            // Unique identifier for our bot comment
            const COMMENT_IDENTIFIER = '<!-- CLIENTS_RELEASE_NOTES_BOT_COMMENT -->';

            try {
              // Get all comments on the PR
              const { data: comments } = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: prNumber,
              });

              // Find existing bot comment
              const existingComment = comments.find(comment => 
                comment.body.includes(COMMENT_IDENTIFIER)
              );

              // Determine comment content based on validation result
              let commentBody;
              
              if (validationResult === 'success') {
                // Validation passed
                commentBody = `${COMMENT_IDENTIFIER}\n## ✅ Client Changes Validated\n\nThis PR contains changes to the \`clients/\` folder and all required sections have been found in the PR description.\n\n- **Release notes:** ✅ Found\n- **Semver:** ✅ Found and valid\n\n> This comment will be automatically removed if you remove all changes to the \`clients/\` folder.\n\n---\n*This is an automated status update.*`;
              } else if (validationResult === 'failure') {
                // Validation failed
                commentBody = `${COMMENT_IDENTIFIER}\n## ❌ Client Changes Validation Failed\n\nThis PR contains changes to the \`clients/\` folder, but the validation failed. Please check the PR validation status for specific errors and ensure you have added the following to your **PR description**:\n\n- **Release notes:** [Single line describing the changes for end users]\n- **Semver:** [breaking|feature|no breaking changes|major|minor|patch]\n\n> This comment will be automatically removed if you remove all changes to the \`clients/\` folder.\n\n---\n*This is an automated reminder. Please check the PR validation status for specific error details.*`;
              } else {
                // Validation skipped, cancelled, or other state - show basic reminder
                // This handles cases where validation job was skipped (shouldn't happen with client changes)
                // or is still running/pending
                commentBody = `${COMMENT_IDENTIFIER}\n## 📝 Client Changes Detected\n\nThis PR contains changes to the \`clients/\` folder. Please ensure you have added the following to your **PR description**:\n\n- **Release notes:** [Single line describing the changes for end users]\n- **Semver:** [breaking|feature|no breaking changes|major|minor|patch]\n\n> This comment will be automatically removed if you remove all changes to the \`clients/\` folder.\n\n---\n*This is an automated reminder. The PR validation will check for these required sections.*`;
              }

              if (existingComment) {
                // Update existing comment
                console.log(`Updating existing comment ${existingComment.id}`);
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existingComment.id,
                  body: commentBody,
                });
                console.log('Comment updated successfully');
              } else {
                // Create new comment
                console.log('Creating new reminder comment');
                const { data: newComment } = await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body: commentBody,
                });
                console.log(`Comment created successfully: ${newComment.id}`);
              }

            } catch (error) {
              console.error('Error managing comment:', error);
              core.setFailed(`Failed to manage comment: ${error.message}`);
            }

  # ==========================================
  # JOBS FOR PRs WITHOUT CLIENT CHANGES
  # ==========================================

  # Delete clients reminder comment when there are NO client changes
  no_client_changes_delete_comment:
    needs: check-client-changes
    if: needs.check-client-changes.outputs.has-client-changes == 'false'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Remove clients reminder comment if present
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            
            // Unique identifier for our bot comment
            const COMMENT_IDENTIFIER = '<!-- CLIENTS_RELEASE_NOTES_BOT_COMMENT -->';

            try {
              // Get all comments on the PR
              const { data: comments } = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: prNumber,
              });

              // Find existing bot comment
              const existingComment = comments.find(comment => 
                comment.body.includes(COMMENT_IDENTIFIER)
              );

              if (existingComment) {
                // Delete the comment
                console.log(`Deleting existing comment ${existingComment.id}`);
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: existingComment.id,
                });
                console.log('Reminder comment deleted successfully');
              } else {
                console.log('No existing reminder comment found - no action needed');
              }

            } catch (error) {
              console.error('Error removing comment:', error);
              // Don't fail the workflow for comment cleanup errors
              console.log('Comment cleanup failed, but continuing...');
            }

  # Set bypass status check when there are NO client changes
  no_client_changes_bypass_validation:
    needs: check-client-changes
    if: needs.check-client-changes.outputs.has-client-changes == 'false'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Set bypass status check for non-client changes
        uses: actions/github-script@v7
        with:
          script: |
            // Set success status for PRs that don't modify clients/
            // This ensures that the branch protection rule is satisfied for non-client changes
            const status_check_name = "Pull Request: Octopus Clients changes have required sections";
            const sha = context.payload.pull_request.head.sha;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: sha,
              state: "success",
              context: status_check_name,
              description: "No clients changes detected - client pull request requirements validation was skipped",
            });
            console.log('Bypass status check set successfully'); 