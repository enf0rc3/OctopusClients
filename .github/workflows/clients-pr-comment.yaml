name: Clients PR Comment Reminder

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'clients/**'

jobs:
  add-clients-reminder:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Add or update clients reminder comment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            
            // Unique identifier for our bot comment
            const COMMENT_IDENTIFIER = '<!-- CLIENTS_RELEASE_NOTES_BOT_COMMENT -->';
            const COMMENT_BODY = `${COMMENT_IDENTIFIER}\n## 📝 Client Changes Detected\n\nThis PR contains changes to the \`clients/\` folder. Please ensure you have added the following to your **PR description**:\n\n- **Release notes:** [Describe the changes for end users]\n- **Semver:** [breaking|feature|no breaking changes|major|minor|patch]\n\n> This comment will be automatically removed if you remove all changes to the \`clients/\` folder.\n\n---\n*This is an automated reminder. The PR validation will check for these required sections.*`;

            try {
              // Get all comments on the PR
              const { data: comments } = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: prNumber,
              });

              // Find existing bot comment
              const existingComment = comments.find(comment => 
                comment.body.includes(COMMENT_IDENTIFIER)
              );

              if (existingComment) {
                // Update existing comment
                console.log(`Updating existing comment ${existingComment.id}`);
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existingComment.id,
                  body: COMMENT_BODY,
                });
                console.log('Comment updated successfully');
              } else {
                // Create new comment
                console.log('Creating new reminder comment');
                const { data: newComment } = await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body: COMMENT_BODY,
                });
                console.log(`Comment created successfully: ${newComment.id}`);
              }

            } catch (error) {
              console.error('Error managing comment:', error);
              core.setFailed(`Failed to manage comment: ${error.message}`);
            } 