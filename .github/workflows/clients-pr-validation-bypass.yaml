name: Octopus Clients PR Comment Check (Bypass)

# This workflow provides a bypass for PRs that don't involve client changes.

# "clients-pr-validation.yaml" checks the description on "Clients" PRs.

# Instead of running the full comment validation workflow on every PR,
# we use path filtering to only run validation when clients/ folder is modified.
# This bypass workflow sets a success status immediately for non-client PRs,
# avoiding unnecessary API calls and improving CI performance.

# For us to block merging client pr's we need to satisfy the the 'Octopus Clients PR Validation' branch protection rule.
# This bypass workflow is used to satisfy the branch protection rule.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    paths-ignore:
      - 'clients/**'

jobs:
  set-success-status:
    runs-on: ubuntu-latest
    steps:
      - name: Set success status for non-clients changes
        # This step immediately sets a success status for PRs that don't modify clients/
        # This ensures that the branch protection rule (that we have for client pr validations is satisfied for non client changes.
        uses: actions/github-script@v7
        with:
          script: |
            const context_name = "Octopus Clients PR Validation";
            const sha = context.payload.pull_request.head.sha;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: sha,
              state: "success",
              context: context_name,
              description: "No clients changes detected - client pr validation skipped",
            }); 