name: Apply Octopus Clients PR Rules (Bypass)

# This workflow provides a bypass for PRs that don't involve client changes.

# "clients-pr-validation.yaml" applies some checks and rules specific to "clients" PRs.

# we use path filtering to only run validation when clients/ folder is modified.
# This bypass workflow avoids unnecessary API calls and improving CI performance.

# It is responsible for:
# - setting a "clients only" required branch protection rule to "success", because the github workflow is skipped for non-clients PRs.
# - removing the clients reminder comment from the PR if it is present. (this is added by the clients-pr-validation.yaml workflow)


on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    paths-ignore:
      - 'clients/**'

jobs:
  # set-success-status:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Set success status for non-clients changes
  #       # This step immediately sets a success status for PRs that don't modify clients/
  #       # This ensures that the branch protection rule (that we have for client pr validations is satisfied for non client changes.
  #       uses: actions/github-script@v7
  #       with:
  #         script: |
  #           const context_name = "Octopus Clients PR Validation";
  #           const sha = context.payload.pull_request.head.sha;

  #           await github.rest.repos.createCommitStatus({
  #             owner: context.repo.owner,
  #             repo: context.repo.repo,
  #             sha: sha,
  #             state: "success",
  #             context: context_name,
  #             description: "No clients changes detected - client pr validation skipped",
  #           });

  # This is the workflow that removes the clients reminder comment from the PR.
  remove-clients-reminder-if-present:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Remove clients reminder comment if present
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            
            // Unique identifier for our bot comment
            const COMMENT_IDENTIFIER = '<!-- CLIENTS_RELEASE_NOTES_BOT_COMMENT -->';

            try {
              // Get all comments on the PR
              const { data: comments } = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: prNumber,
              });

              // Find existing bot comment
              const existingComment = comments.find(comment => 
                comment.body.includes(COMMENT_IDENTIFIER)
              );

              if (existingComment) {
                // Delete the comment
                console.log(`Deleting existing comment ${existingComment.id}`);
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: existingComment.id,
                });
                console.log('Reminder comment deleted successfully');
              } else {
                console.log('No existing reminder comment found - no action needed');
              }

            } catch (error) {
              console.error('Error removing comment:', error);
              // Don't fail the workflow for comment cleanup errors
              console.log('Comment cleanup failed, but continuing...');
            }